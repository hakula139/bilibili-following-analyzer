[project]
name = "bilibili-following-analyzer"
version = "0.1.0"
description = "Analyze your Bilibili following list"
requires-python = ">=3.10"
dependencies = [
  "diskcache>=5.6",
  "platformdirs>=4.0",
  "python-dotenv>=1.0",
  "requests>=2.28",
  "tqdm>=4.60",
]

[dependency-groups]
dev = [
  "diskcache-stubs>=5.6",
  "mypy>=1.19.1",
  "pytest>=9.1.1",
  "tqdm-stubs>=0.2",
  "types-requests>=2.32.4.20260107",
]

[project.scripts]
bilibili-analyzer = "bilibili_following_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bilibili_following_analyzer"]

[tool.uv]
python-preference = "system"

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "S", "SIM", "UP", "W"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["."]
exclude_gitignore = true
strict = true
