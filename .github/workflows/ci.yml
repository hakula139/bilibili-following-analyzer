name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: hakula139/devkit/actions/setup-nix@d3958e313d1c13d44e3cebb75afb610e3c712d3d

      - name: Check
        run: nix flake check --print-build-logs

  python:
    name: Python Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: hakula139/devkit/actions/setup-nix@d3958e313d1c13d44e3cebb75afb610e3c712d3d

      - name: Install dependencies
        run: nix develop .#python -c uv sync --locked

      - name: Lint
        run: nix develop .#python -c uv run --no-sync ruff check

      - name: Format
        run: nix develop .#python -c uv run --no-sync ruff format --check

      - name: Type check
        run: nix develop .#python -c uv run --no-sync mypy

      - name: Security lint
        run: nix develop .#python -c uv run --no-sync bandit -r bilibili_following_analyzer/

      - name: Test
        run: nix develop .#python -c uv run --no-sync pytest -q

  result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs: [nix, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check results
        uses: hakula139/devkit/actions/ci-result@d3958e313d1c13d44e3cebb75afb610e3c712d3d
