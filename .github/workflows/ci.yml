name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    uses: hakula139/devkit/.github/workflows/nix.yml@v2

  python:
    name: Python Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v2

      - name: Install dependencies
        run: nix develop .#python -c uv sync --locked

      - name: Type check
        run: nix develop .#python -c uv run --no-sync mypy

      - name: Test
        run: nix develop .#python -c uv run --no-sync pytest -q

  result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs: [nix, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check results
        uses: hakula139/devkit/.github/actions/ci-result@v2
